# events { } -> Nginx connection handling settings
events {
    # Maximum number of client connections that each Nginx worker process can handle at the same time
    worker_connections 1024;
}

# http { } -> Settings shared by all HTTP servers
http {
    # include -> Load another Nginx configuration file here
    # Tell Nginx the correct Content-Type for different file extensions
    # (HTML, CSS, JS, images, fonts, etc.)
    # Without this, unknown files would be served as application/octet-stream
    include /etc/nginx/mime.types;

    # default_type -> MIME type used when Nginx cannot determine the correct type for a file
    # application/octet-stream is the generic MIME type for binary data
    default_type application/octet-stream;

    # server { } -> a virtual server (an Nginx can have multiple servers)
    server {
        # Listen on port 80 (standard HTTP port)
        listen 80;

        # server_name -> Domain names that match this server block
        # Here, 'localhost' matches requests to http://localhost
        server_name localhost;

        # Directory from which Nginx serves built React files
        root /usr/share/nginx/html;

        # Default file to serve
        # index -> Default file to return when requesting a directory
        # Example:
        # GET /
        # -> /usr/share/nginx/html/index.html
        index index.html;

        # location -> Defines how Nginx should handle requests matching a specific URL pattern
        # '/' means this rule matches every request
        # try_files -> Try each path ($uri, $uri/ etc.) in order
        # $uri          -> Exact requested file
        # $uri/         -> Requested directory
        # /index.html   -> Fallback if neither exists
        # This is required for React Router (SPA routing)
        # When user visits /dashboard or /interview/123 directly in browser
        location / {
            try_files $uri $uri/ /index.html;
        }

        # '~*' means:
        # ~  -> Regular expression match
        # *  -> Case-insensitive
        # \. -> Match a literal '.'
        # (...) -> Group of allowed extensions
        # $ -> Match only if the URL ends here
        # Vite adds a hash to filenames (index-abc123.js)
        # So when code changes, filename changes, browser fetches new file
        # These files are safe to cache for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # expires -> Tell browsers how long this file can be cached
            expires 1y;

            # add_header -> Add an HTTP response header
            # Cache-Control:
            # public     -> Can be cached by browsers and proxies
            # immutable  -> File will never change (because Vite hashes filenames)
            add_header Cache-Control "public, immutable";
        }

        # Security Header
        # Do not allow this site to be embedded in an iframe (clickjacking protection)
        add_header X-Frame-Options "SAMEORIGIN";

        # Prevent browser from guessing file types (MIME sniffing protection)
        add_header X-Content-Type-Options "nosniff";

        # gzip -> Enable Gzip compression
        gzip on;

        # gzip_types -> File types that should be compressed
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            image/svg+xml;

        # gzip_min_length -> Only compress responses larger than 1000 bytes
        gzip_min_length 1000;
    }
}
