# events { } -> Nginx connection handling settings
events {
    # Maximum number of client connections that each Nginx worker process can handle at the same time
    worker_connections 1024;
}

# http { } -> Settings shared by all HTTP servers
http {
    # include -> Load another Nginx configuration file here
    # Tell Nginx the correct Content-Type for different file extensions
    # (HTML, CSS, JS, images, fonts, etc.)
    # Without this, unknown files would be served as application/octet-stream
    include /etc/nginx/mime.types;

    # default_type -> specified MIME type used when Nginx cannot determine the correct type for a file
    # application/octet-stream is the generic MIME type for binary data
    default_type application/octet-stream;

    # server { } -> a virtual server (an Nginx can have multiple servers)
    server {
        # Listen on port 80 (standard HTTP port)
        listen 80;

        # server_name specifies which hostnames this server block should handle
        # "_" is commonly used as a catch-all value, meaning this server will
        # respond regardless of the Host header sent by the client
        # This is useful for Docker containers because they are often accessed
        # through different hostnames, IP addresses or reverse proxies
        server_name _;

        # Directory from which Nginx serves built React files
        root /usr/share/nginx/html;

        # Default file to serve
        # index -> Default file to return when requesting a directory
        # Example:
        # GET /
        # -> /usr/share/nginx/html/index.html
        index index.html;

        # location -> Defines how Nginx should handle requests matching a specific URL pattern
        # '/' means this rule matches every request
        # try_files -> Try each path ($uri, $uri/ etc.) in order
        # $uri          -> Exact requested file
        # $uri/         -> Requested directory
        # /index.html   -> Fallback if neither exists
        # This is required for React Router (SPA routing)
        # When user visits /dashboard or /interview/123 directly in browser
        location / {
            try_files $uri $uri/ /index.html;
        }

        # '~*' means:
        # ~  -> Regular expression match
        # *  -> Case-insensitive
        # \. -> Match a literal '.'
        # (...) -> Group of allowed extensions
        # $ -> Match only if the URL ends here
        # Vite adds a hash to filenames (index-abc123.js)
        # So when code changes, filename changes, browser fetches new file, not the old files as the hash don't match
        # So these latest files are safe to cache for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # expires -> Tell browsers how long this file can be cached
            expires 1y;

            # add_header -> Add an HTTP response header
            # Cache-Control:
            # public     -> Can be cached by browsers and proxies
            # immutable  -> File will never change (because Vite hashes filenames everytime when build happens)
            add_header Cache-Control "public, immutable";
        }

        # Prevent this website from being embedded inside an iframe on another website
        # This helps protect against Clickjacking attacks, where a malicious website
        # tricks users into clicking invisible elements from our application by embedding our website into their's in an iframe
        # "SAMEORIGIN" allows embedding only from the same website
        add_header X-Frame-Options "SAMEORIGIN";

        # Prevent browsers from guessing (sniffing) a file's MIME type
        # Browsers should trust the Content-Type sent by the server instead of trying
        # to interpret the file differently, which helps reduce certain security risks
        add_header X-Content-Type-Options "nosniff";

        # Control how much referrer information the browser sends when navigating to another website
        # "strict-origin-when-cross-origin" sends:
        # - Full URL for requests within the same website
        # - Only the website's origin (scheme + domain + port) to other websites
        # This reduces unnecessary information leakage while keeping useful analytics
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # gzip -> Enable Gzip compression
        gzip on;

        # gzip_types -> File types that should be compressed
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            image/svg+xml
            font/ttf
            font/otf;

        # gzip_min_length -> Only compress responses larger than 1000 bytes
        gzip_min_length 1000;
    }
}
